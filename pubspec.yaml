name: huellitas
description: "Huellitas: cuidado de mascotas en un solo lugar."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  material_ui: ^1.11.0
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  hydrated_bloc: ^11.0.0
  path_provider: ^2.1.6
  go_router: ^18.1.4
  get_it: ^9.3.0
  intl: ^0.20.3
  flutter_svg: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3
  alchemist: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/illustrations-3d/
    - assets/avatars-3d/
    - assets/illustrations/
    - assets/avatars/
    - assets/icons/
    - assets/brands/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
